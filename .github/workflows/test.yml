name: Run tests

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test (Node ${{ matrix.node }})
        timeout-minutes: 15
        strategy:
            matrix:
                node: [20.x, 22.x, 24.x, latest]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm install
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
              if: matrix.node != '24.x'
            # One matrix entry runs the suite under c8, which enforces the thresholds in .c8rc.json
            - run: npm run test:coverage
              if: matrix.node == '24.x'
            # Requires the built CommonJS entry with require(esm) switched off, the way EmailEngine's
            # pkg binary loads it; Node 20 has no such flag to set
            - run: npm run test:cjs
              if: matrix.node != '20.x'

    # The library is used from Bun as well: the ES module build and the same test
    # suite are run under the latest Bun release
    bun:
        name: Test (Bun latest)
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: npm install
            - run: npm run test:bun

    # The ES module build on the Cloudflare Workers runtime: wrangler starts a local
    # workerd with test/cloudflare/worker.ts, which runs IMAP sessions against an
    # in-process mock server and against Ethereal over TLS
    test-workers:
        name: Cloudflare Workers (workerd)
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm install
            - run: npm run test:workers

    # The ES module build on celld (https://celld.dev): `celld dev` runs in Docker with host
    # networking and test/celld/worker.ts runs sessions through createSocketsTransport(),
    # since celld has no node:net or node:tls
    test-celld:
        name: celld (Docker)
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm install
            - run: npm run test:celld
              env:
                  CELLD_KEEP_LOGS: '1'
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: celld-log
                  path: .celld/celld.log
                  if-no-files-found: ignore

    # The ES module build in headless Chrome (preinstalled on the ubuntu runners): esbuild bundles
    # it with polyfills for the Node.js builtins, and test/browser/page.ts runs sessions through
    # the transport option against the browser build of ImapKit in the same page
    test-browser:
        name: Browser (headless Chrome)
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm install
            - run: npm run test:browser

    test-rev2:
        # Live IMAP4rev2 integration tests against a real Dovecot 2.4 server in
        # Docker on linux/amd64 (ubuntu runners are amd64 with Docker preinstalled).
        # This is the only place the suite runs on amd64 - Apple Silicon dev
        # machines cannot run the amd64 image under Rosetta.
        name: Live IMAP4rev2 tests (Dovecot, linux/amd64)
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm install
            - run: npm run test:rev2
              env:
                  IMAPFLOW_DOVECOT_PLATFORM: linux/amd64

    test-james:
        # Live integration tests against Apache James in Docker (the base of hosted
        # services such as Twake Mail). The image is only published for linux/amd64,
        # so this native run is the reference one.
        name: Live Apache James tests (linux/amd64)
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm install
            - run: npm run test:james
